name: Publish release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with the mod zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" "release/ChaosMode-${TAG}.zip" \
            --title "Chaos Mode ${TAG}" --notes-file "release/notes-${TAG}.md"
