name: Publish release
# Runs whenever a new release zip lands in release/ (named ChaosMode-vX.Y.zip with release/notes-vX.Y.md).
on:
  push:
    branches: [main]
    paths: ["release/*.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with the newest mod zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls release/ChaosMode-v*.zip | sort -V | tail -1)
          TAG=$(basename "$ZIP" .zip | sed 's/^ChaosMode-//')
          # ChatBridge ships as its own zip next to the plugin zip (release/ChatBridge-vX.Y.zip), if present
          ASSETS=("$ZIP")
          if [ -f "release/ChatBridge-$TAG.zip" ]; then ASSETS+=("release/ChatBridge-$TAG.zip"); fi
          # recreate the release so its tag always points at the current commit
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Chaos Mode $TAG" --notes-file "release/notes-$TAG.md" --latest
